name: Update integration comment

inputs:
  token:
    required: true
  repo:
    required: true
  repo_owner:
    required: true
  issue_number:
    required: true
  comment_id:
    required: true
  frontend:
    required: true
  backend:
    required: true
  media:
    required: true
  run_id:
    required: true
  conclusion:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        REPO: ${{ inputs.repo }}
        REPO_OWNER: ${{ inputs.repo_owner }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        COMMENT_ID: ${{ inputs.comment_id }}
        FRONTEND: ${{ inputs.frontend }}
        BACKEND: ${{ inputs.backend }}
        MEDIA: ${{ inputs.media }}
        RUN_ID: ${{ inputs.run_id }}
        CONCLUSION: ${{ inputs.conclusion }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = process.env.REPO_OWNER;
          const repo = process.env.REPO.replace(owner + '/', '');
          const issue_number = Number(process.env.ISSUE_NUMBER);
          const comment_id = Number(process.env.COMMENT_ID);
          const conclusion = process.env.CONCLUSION;
          const runId = process.env.RUN_ID;

          const statusLine =
            conclusion === 'success'
              ? '✅ **Integration tests passed**'
              : '❌ **Integration tests failed**';

          const body = `
          <!-- integration-test -->
          ### 🧪 Integration tests

          **Docker images**
          - marrygram-frontend: \`${process.env.FRONTEND}\`
          - marrygram-backend: \`${process.env.BACKEND}\`
          - marrygram-media-compressor: \`${process.env.MEDIA}\`

          **Status**
          ${statusLine}

          🔗 https://github.com/jangiese/marrygram-docker/actions/runs/${runId}
          `;

          await github.rest.issues.updateComment({
            owner,
            repo,
            comment_id,
            body,
          });
