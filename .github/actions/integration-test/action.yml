name: integration-test-action

inputs:
  password:
    description: 'Password for the container registry'
    required: true
  issue_number:
    description: 'The PR number triggering this build'
  repo:
    description: 'Repository triggering this build'
  repo_owner:
    description: 'Owner of the repository triggering this build'

runs:
  using: "composite"
  steps:
    - name: Resolve docker tags from PR comment
      id: docker-tags
      if: inputs.issue_number
      uses: actions/github-script@v7
      with:
        github-token: ${{inputs.password}}
        script: |
          const owner = inputs.repo_owner;
          const repo = inputs.repo;
          const issue_number = inputs.issue_number;

          const marker = '<!-- integration-test-docker-tags -->';

          const defaultTags = {
            frontend: 'latest',
            backend: 'development',
            media: 'latest',
          };

          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
          });

          let comment = comments.find(c => c.body.includes(marker));

          if (!comment) {
            const body = `
          ${marker}
          **Integration test docker images**

          - marrygram-frontend: \`${defaultTags.frontend}\`
          - marrygram-backend: \`${defaultTags.backend}\`
          - marrygram-media-compressor: \`${defaultTags.media}\`
          `;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

            core.setOutput('frontend', defaultTags.frontend);
            core.setOutput('backend', defaultTags.backend);
            core.setOutput('media', defaultTags.media);
            return;
          }

          const extract = (name) => {
            const match = comment.body.match(
              new RegExp(`${name}:\\s*\\\`([^\\\`]+)\\\``)
            );
            return match ? match[1] : null;
          };

          core.setOutput('frontend', extract('marrygram-frontend') ?? defaultTags.frontend);
          core.setOutput('backend', extract('marrygram-backend') ?? defaultTags.backend);
          core.setOutput('media', extract('marrygram-media-compressor') ?? defaultTags.media);

    - name: Trigger E2E tests
      uses: peter-evans/repository-dispatch@v3
      with:
        repository: jangiese/marrygram-docker
        token: ${{ inputs.password }}
        event-type: run-integration-tests

    - name: Wait for workflow to start
      shell: bash
      run: |
        echo "Waiting for E2E workflow to start..."
        sleep 10

    - name: Get workflow run ID
      shell: bash
      id: get-run
      env:
        GH_TOKEN: ${{ inputs.password }}
      run: |
        echo "Fetching latest workflow run..."
        
        # Get the latest workflow run triggered by repository_dispatch
        run_id=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/jangiese/marrygram-docker/actions/runs \
          --jq '.workflow_runs[] | select(.event == "repository_dispatch") | .id' | head -n 1)
        
        if [ -z "$run_id" ]; then
          echo "No workflow run found"
          exit 1
        fi
        
        echo "run_id=$run_id" >> $GITHUB_OUTPUT
        echo "Found workflow run: $run_id"
        echo "View at: https://github.com/jangiese/marrygram-docker/actions/runs/$run_id"

    - name: Wait for E2E tests completion
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.password }}
        RUN_ID: ${{ steps.get-run.outputs.run_id }}
      run: |
        echo "Waiting for workflow run $RUN_ID to complete..."
        
        max_wait=600  # 10 minutes
        elapsed=0
        interval=30
        
        while [ $elapsed -lt $max_wait ]; do
          status=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/jangiese/marrygram-docker/actions/runs/$RUN_ID \
            --jq '.status')
        
          conclusion=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/jangiese/marrygram-docker/actions/runs/$RUN_ID \
            --jq '.conclusion')
        
          echo "Status: $status, Conclusion: $conclusion"
        
          if [ "$status" = "completed" ]; then
            echo "conclusion=$conclusion" >> $GITHUB_ENV
            break
          fi
        
          sleep $interval
          elapsed=$((elapsed + interval))
          echo "Waited ${elapsed}s / ${max_wait}s..."
        done
        
        if [ $elapsed -ge $max_wait ]; then
          echo "Timeout waiting for E2E tests to complete"
          exit 1
        fi

    - name: Report E2E test results
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.password }}
        RUN_ID: ${{ steps.get-run.outputs.run_id }}
      run: |
        conclusion=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/jangiese/marrygram-docker/actions/runs/$RUN_ID \
          --jq '.conclusion')
        
        echo "================================"
        echo "E2E Test Results"
        echo "================================"
        echo "Workflow Run ID: $RUN_ID"
        echo "URL: https://github.com/jangiese/marrygram-docker/actions/runs/$RUN_ID"
        echo "Conclusion: $conclusion"
        echo "================================"
        
        if [ "$conclusion" != "success" ]; then
          echo "❌ E2E tests failed or were cancelled"
          exit 1
        else
          echo "✅ E2E tests passed successfully"
        fi
