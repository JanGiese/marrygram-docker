name: Integration Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-tests:
    uses: JanGiese/marrygram-docker/.github/workflows/integration-test.yml@feture/restructure_workflows_and_actions
    with:
      frontend_tag: latest
      backend_tag: latest
      media_tag: latest
      branch: ${{ github.head_ref || github.ref_name }}
      repo: ${{ github.repository }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
