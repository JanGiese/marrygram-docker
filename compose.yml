services:
  frontend:
    image: ghcr.io/jangiese/marrygram-frontend:development
    container_name: marrygram-frontend
    restart: always
    env_file:
      - stack.env
    depends_on:
      - backend

  backend:
    image: ghcr.io/jangiese/marrygram-backend:development
    container_name: marrygram-backend
    restart: always
    env_file:
      - stack.env
    depends_on:
      - db
      - minio
      - rabbitmq
    extra_hosts:
      - "minio.jpgiese.com:host-gateway"

  media-compressor:
    image: ghcr.io/jangiese/marrygram-media-compressor:latest
    container_name: marrygram-media-compressor
    restart: always
    env_file:
      - stack.env
    depends_on:
      - db
      - minio
      - rabbitmq
    extra_hosts:
      - "minio.jpgiese.com:host-gateway"

  db:
    image: postgres:17
    container_name: marrygram-db
    restart: always
    ports: # remove for production
      - "6432:5432"
    env_file:
      - stack.env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio
    container_name: marrygram-storage
    command: server /data --console-address ":9001"
    restart: always
    env_file:
      - stack.env
    volumes:
      - minio-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: marrygram-rabbitmq
    restart: always

volumes:
  db-data:
  minio-data:

networks:
  default:
    name: nginx
    external: true
